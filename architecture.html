<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Architecture - Pipeline detection de fraude</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #f8fafc;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px;
    }
    .frame {
      width: 100%;
      max-width: 1400px;
    }
    .title {
      text-align: center;
      margin-bottom: 28px;
    }
    .title h1 {
      font-size: 26px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .title p {
      font-size: 14px;
      color: #64748b;
    }
    svg { width: 100%; height: auto; display: block; }
    .help {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: #94a3b8;
      font-size: 12px;
    }
    .help kbd {
      background: #1e293b;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="title">
      <h1>Pipeline de detection de fraude - Architecture Kappa</h1>
      <p>Bloc 3 RNCP38777 - Sebastien Codron</p>
    </div>

    <svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
        </marker>
        <filter id="soft">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
        </filter>
      </defs>

      <!-- ============= KAFKA CLUSTER (big green box) ============= -->
      <rect x="280" y="80" width="700" height="600" rx="16" fill="none" stroke="#16a34a" stroke-width="3"/>
      <text x="320" y="110" font-size="14" font-weight="700" fill="#16a34a" letter-spacing="1.5">KAFKA CLUSTER</text>

      <!-- Kafka logo bottom-left of green box -->
      <g transform="translate(310, 620)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#16a34a" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">K</text>
        <text x="32" y="5" font-size="13" font-weight="600" fill="#475569">kafka</text>
      </g>

      <!-- ============= ZONE 1 : SOURCE (left) ============= -->

      <!-- API source : Hugging Face Spaces -->
      <g filter="url(#soft)">
        <rect x="40" y="180" width="180" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="130" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">API HF Spaces</text>
        <text x="130" y="228" text-anchor="middle" font-size="11" fill="#78350f">/current-transactions</text>
        <text x="130" y="245" text-anchor="middle" font-size="11" fill="#78350f">JSON (Pandas split)</text>
        <text x="130" y="262" text-anchor="middle" font-size="11" font-style="italic" fill="#a16207">streaming continu</text>
      </g>

      <!-- arrow from API to Producer -->
      <line x1="220" y1="230" x2="320" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="240" y="220" font-size="11" fill="#64748b" font-style="italic">poll 3s</text>

      <!-- ============= INSIDE KAFKA CLUSTER ============= -->

      <!-- Producer -->
      <g filter="url(#soft)">
        <rect x="320" y="190" width="170" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
        <text x="405" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Producer</text>
        <text x="405" y="236" text-anchor="middle" font-size="11" fill="#854d0e">producer.py - poll 3s</text>
        <text x="405" y="252" text-anchor="middle" font-size="10" fill="#854d0e">Pydantic + SHA-256</text>
        <text x="405" y="268" text-anchor="middle" font-size="10" font-style="italic" fill="#a16207">RGPD compliant</text>
      </g>

      <!-- arrow Producer -> Topic raw -->
      <line x1="490" y1="230" x2="600" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="510" y="220" font-size="11" fill="#64748b" font-style="italic">publie</text>

      <!-- Topic raw-transactions -->
      <g filter="url(#soft)">
        <rect x="600" y="190" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
        <text x="690" y="212" text-anchor="middle" font-size="11" fill="#5b21b6" letter-spacing="1">TOPIC</text>
        <text x="690" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">raw-transactions</text>
        <text x="690" y="254" text-anchor="middle" font-size="11" fill="#6d28d9">paiements bruts</text>
        <text x="690" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#7c3aed">valides</text>
      </g>

      <!-- arrow Topic -> Predictor -->
      <line x1="690" y1="280" x2="690" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="700" y="315" font-size="11" fill="#64748b" font-style="italic">consume</text>

      <!-- Consumer Predictor -->
      <g filter="url(#soft)">
        <rect x="580" y="345" width="220" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="690" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Consumer prediction</text>
        <text x="690" y="390" text-anchor="middle" font-size="11" fill="#1e40af">consumer_predictor.py</text>
        <text x="690" y="406" text-anchor="middle" font-size="10" fill="#3730a3">fraud-consumer-group</text>
        <text x="690" y="425" text-anchor="middle" font-size="10" font-style="italic" fill="#2563eb">RandomForest balanced</text>
      </g>

      <!-- arrow Predictor -> Topic predictions -->
      <line x1="690" y1="445" x2="690" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="700" y="475" font-size="11" fill="#64748b" font-style="italic">publie</text>

      <!-- Topic fraud-predictions -->
      <g filter="url(#soft)">
        <rect x="580" y="500" width="220" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
        <text x="690" y="522" text-anchor="middle" font-size="11" fill="#9a3412" letter-spacing="1">TOPIC</text>
        <text x="690" y="544" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">fraud-predictions</text>
        <text x="690" y="564" text-anchor="middle" font-size="11" fill="#c2410c">is_fraud + score</text>
        <text x="690" y="580" text-anchor="middle" font-size="10" font-style="italic" fill="#ea580c">enrichi par le modele</text>
      </g>

      <!-- DLQ (small box, dashed) -->
      <g filter="url(#soft)">
        <rect x="320" y="340" width="170" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
        <text x="405" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">DLQ</text>
        <text x="405" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">dlq-raw</text>
        <text x="405" y="398" text-anchor="middle" font-size="10" font-style="italic" fill="#991b1b">quarantaine</text>
        <text x="405" y="412" text-anchor="middle" font-size="10" font-style="italic" fill="#991b1b">si validation KO</text>
      </g>

      <!-- arrow Producer -> DLQ -->
      <path d="M 405 280 Q 405 310 405 340" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
      <text x="415" y="315" font-size="10" fill="#dc2626" font-style="italic">si KO</text>

      <!-- ============= ALERTE EMAIL (left, outside kafka box visually but inside green frame to keep it close) ============= -->
      <g filter="url(#soft)">
        <rect x="320" y="540" width="170" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
        <text x="405" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">Alerte Email</text>
        <text x="405" y="583" text-anchor="middle" font-size="10" fill="#be185d">consumer_alerter.py</text>
        <text x="405" y="598" text-anchor="middle" font-size="10" font-style="italic" fill="#db2777">webhook + SMTP</text>
      </g>

      <!-- arrow predictions -> alert -->
      <line x1="580" y1="555" x2="490" y2="555" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="510" y="545" font-size="10" fill="#db2777" font-style="italic">si fraude</text>

      <!-- ============= ZONE 3 (right) : External services ============= -->

      <!-- MLflow (loads model into predictor) -->
      <g filter="url(#soft)">
        <rect x="1030" y="190" width="170" height="90" rx="10" fill="#fff" stroke="#0891b2" stroke-width="2"/>
        <text x="1115" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">MLflow</text>
        <text x="1115" y="238" text-anchor="middle" font-size="11" fill="#155e75">tracking et registry</text>
        <text x="1115" y="254" text-anchor="middle" font-size="10" font-style="italic" fill="#0e7490">model.pkl versionne</text>
        <text x="1115" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#0e7490">localhost:5000</text>
      </g>

      <!-- MinIO (artifacts) -->
      <g filter="url(#soft)">
        <rect x="1230" y="190" width="140" height="90" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/>
        <text x="1300" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">MinIO</text>
        <text x="1300" y="238" text-anchor="middle" font-size="11" fill="#831843">stockage S3</text>
        <text x="1300" y="254" text-anchor="middle" font-size="10" font-style="italic" fill="#9d174d">artefacts ML</text>
        <text x="1300" y="270" text-anchor="middle" font-size="10" font-style="italic" fill="#9d174d">localhost:9001</text>
      </g>

      <!-- arrow MLflow -> Predictor (charge modele) -->
      <line x1="1030" y1="395" x2="800" y2="395" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="850" y="385" font-size="11" fill="#0e7490" font-style="italic">charge model.pkl</text>

      <!-- arrow MLflow <-> MinIO (artifacts) -->
      <line x1="1200" y1="235" x2="1230" y2="235" stroke="#be185d" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="1192" y="225" font-size="10" fill="#9d174d" font-style="italic">artifacts</text>

      <!-- PostgreSQL -->
      <g filter="url(#soft)">
        <rect x="1080" y="430" width="170" height="100" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
        <text x="1165" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
        <text x="1165" y="478" text-anchor="middle" font-size="11" fill="#1e40af">payments_gold</text>
        <text x="1165" y="494" text-anchor="middle" font-size="10" font-style="italic" fill="#1e40af">UPSERT idempotent</text>
        <text x="1165" y="512" text-anchor="middle" font-size="10" font-style="italic" fill="#1e40af">localhost:5432</text>
      </g>

      <!-- arrow predictions -> Postgres (via consumer storage) -->
      <line x1="800" y1="555" x2="1080" y2="490" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="900" y="510" font-size="11" fill="#1e40af" font-style="italic">consumer_storage</text>
      <text x="900" y="525" font-size="10" fill="#475569" font-style="italic">sauvegarde</text>

      <!-- Streamlit Dashboard -->
      <g filter="url(#soft)">
        <rect x="1080" y="580" width="170" height="90" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
        <text x="1165" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Streamlit</text>
        <text x="1165" y="626" text-anchor="middle" font-size="11" fill="#b91c1c">Dashboard temps reel</text>
        <text x="1165" y="642" text-anchor="middle" font-size="10" font-style="italic" fill="#dc2626">5 KPIs + agregations</text>
        <text x="1165" y="658" text-anchor="middle" font-size="10" font-style="italic" fill="#dc2626">localhost:8501</text>
      </g>

      <!-- arrow Postgres -> Streamlit -->
      <line x1="1165" y1="530" x2="1165" y2="580" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="1175" y="558" font-size="10" fill="#dc2626" font-style="italic">historique</text>

      <!-- ============= FOOTER : 5 competences ============= -->
      <rect x="0" y="710" width="1400" height="50" fill="#1e293b"/>
      <text x="40" y="740" font-size="13" font-weight="700" fill="#f1f5f9">5 competences Bloc 3 :</text>
      <text x="220" y="740" font-size="12" font-weight="600" fill="#fbbf24">1. Temps reel (Kafka)</text>
      <text x="430" y="740" font-size="12" font-weight="600" fill="#60a5fa">2. ETL (Producer-Consumer-DB)</text>
      <text x="700" y="740" font-size="12" font-weight="600" fill="#a3e635">3. Automatisation (Docker)</text>
      <text x="940" y="740" font-size="12" font-weight="600" fill="#34d399">4. Monitoring (Dashboard)</text>
      <text x="1180" y="740" font-size="12" font-weight="600" fill="#f87171">5. Qualite (DLQ + Pydantic)</text>
    </svg>
  </div>

  <div class="help">Plein ecran : <kbd>F11</kbd>&nbsp;-&nbsp;Quitter : <kbd>Echap</kbd></div>
</body>
</html>
