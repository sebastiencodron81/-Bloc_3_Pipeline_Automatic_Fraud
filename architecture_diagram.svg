<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Marker for arrows -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <!-- Soft drop-shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#f8fafc"/>

  <!-- Title -->
  <text x="700" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#0f172a">Pipeline de détection de fraude — Architecture Lambda</text>
  <text x="700" y="66" font-size="14" text-anchor="middle" fill="#475569">Bloc 3 RNCP38777 · Kafka · PostgreSQL · MLflow · Streamlit</text>

  <!-- Zone 1 : SOURCE -->
  <rect x="30" y="100" width="220" height="640" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="140" y="125" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412" letter-spacing="0.5">① SOURCE</text>

  <!-- CSV historique -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="180" height="80" rx="8" fill="#fff" stroke="#f97316" stroke-width="1.5"/>
    <text x="140" y="185" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">fraudTest.csv</text>
    <text x="140" y="205" font-size="11" text-anchor="middle" fill="#64748b">555 719 transactions</text>
    <text x="140" y="220" font-size="11" text-anchor="middle" fill="#64748b">étiquetées (is_fraud)</text>
    <text x="140" y="235" font-size="10" text-anchor="middle" font-style="italic" fill="#9a3412">→ entraînement modèle</text>
  </g>

  <!-- Fake API -->
  <g filter="url(#shadow)">
    <rect x="50" y="280" width="180" height="100" rx="8" fill="#fff" stroke="#f97316" stroke-width="1.5"/>
    <text x="140" y="305" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">fake_api.py</text>
    <text x="140" y="325" font-size="11" text-anchor="middle" fill="#64748b">FastAPI · port 8002</text>
    <text x="140" y="340" font-size="11" text-anchor="middle" fill="#64748b">/current-transactions</text>
    <text x="140" y="358" font-size="10" text-anchor="middle" font-style="italic" fill="#9a3412">replay streaming</text>
    <text x="140" y="372" font-size="10" text-anchor="middle" font-style="italic" fill="#9a3412">~1 paiement / 0,2 s</text>
  </g>

  <!-- ML Training (offline) -->
  <g filter="url(#shadow)">
    <rect x="50" y="420" width="180" height="120" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="140" y="442" font-size="12" font-weight="700" text-anchor="middle" fill="#854d0e">PHASE OFFLINE</text>
    <text x="140" y="465" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Notebook EDA</text>
    <text x="140" y="482" font-size="11" text-anchor="middle" fill="#64748b">scikit-learn Pipeline</text>
    <text x="140" y="497" font-size="11" text-anchor="middle" fill="#64748b">RandomForest balanced</text>
    <text x="140" y="515" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">→ model.pkl</text>
    <text x="140" y="530" font-size="10" text-anchor="middle" font-style="italic" fill="#854d0e">tracking MLflow</text>
  </g>

  <!-- Arrow CSV → Notebook -->
  <line x1="140" y1="240" x2="140" y2="280" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="140" y1="380" x2="140" y2="420" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Zone 2 : PROCESSING -->
  <rect x="290" y="100" width="700" height="640" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="125" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af" letter-spacing="0.5">② PROCESSING — Kafka & ML</text>

  <!-- Producer -->
  <g filter="url(#shadow)">
    <rect x="320" y="160" width="160" height="90" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="184" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">producer.py</text>
    <text x="400" y="204" font-size="10" text-anchor="middle" fill="#64748b">poll 6s · batch 30</text>
    <text x="400" y="219" font-size="10" text-anchor="middle" fill="#64748b">Pydantic validation</text>
    <text x="400" y="234" font-size="10" font-weight="600" text-anchor="middle" fill="#dc2626">SHA-256 cc_num (RGPD)</text>
  </g>

  <!-- Topic raw -->
  <g filter="url(#shadow)">
    <rect x="540" y="160" width="160" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="620" y="180" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" letter-spacing="0.5">TOPIC KAFKA</text>
    <text x="620" y="204" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">raw-transactions</text>
    <text x="620" y="225" font-size="11" text-anchor="middle" fill="#475569">paiements bruts</text>
    <text x="620" y="240" font-size="11" text-anchor="middle" fill="#475569">validés &amp; pseudonymisés</text>
  </g>

  <!-- DLQ -->
  <g filter="url(#shadow)">
    <rect x="320" y="280" width="160" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="400" y="302" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">DLQ KAFKA</text>
    <text x="400" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">dlq-raw</text>
    <text x="400" y="342" font-size="10" text-anchor="middle" fill="#64748b">messages invalides</text>
    <text x="400" y="356" font-size="10" font-style="italic" fill="#991b1b">→ quarantaine</text>
  </g>

  <!-- Consumer Predictor -->
  <g filter="url(#shadow)">
    <rect x="760" y="160" width="200" height="120" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="860" y="184" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">consumer_predictor.py</text>
    <text x="860" y="205" font-size="11" text-anchor="middle" fill="#64748b">charge model.pkl</text>
    <text x="860" y="222" font-size="11" text-anchor="middle" fill="#64748b">feature engineering</text>
    <text x="860" y="237" font-size="11" text-anchor="middle" fill="#64748b">predict + score</text>
    <text x="860" y="258" font-size="10" font-weight="600" text-anchor="middle" fill="#1e40af">latence &lt; 5 secondes</text>
    <text x="860" y="272" font-size="10" font-style="italic" text-anchor="middle" fill="#475569">commit offset après succès</text>
  </g>

  <!-- Topic predictions -->
  <g filter="url(#shadow)">
    <rect x="540" y="380" width="160" height="100" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="620" y="400" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a" letter-spacing="0.5">TOPIC KAFKA</text>
    <text x="620" y="424" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">fraud-predictions</text>
    <text x="620" y="445" font-size="11" text-anchor="middle" fill="#475569">paiements scorés</text>
    <text x="620" y="460" font-size="11" text-anchor="middle" fill="#475569">is_fraud + score</text>
  </g>

  <!-- MLflow registry -->
  <g filter="url(#shadow)">
    <rect x="320" y="540" width="160" height="100" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="400" y="563" font-size="11" font-weight="700" text-anchor="middle" fill="#155e75" letter-spacing="0.5">REGISTRY ML</text>
    <text x="400" y="585" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">MLflow + MinIO</text>
    <text x="400" y="605" font-size="10" text-anchor="middle" fill="#64748b">tracking experiences</text>
    <text x="400" y="620" font-size="10" text-anchor="middle" fill="#64748b">versioning modèles</text>
    <text x="400" y="635" font-size="10" font-style="italic" text-anchor="middle" fill="#155e75">artefacts S3-compatibles</text>
  </g>

  <!-- Arrows zone 2 -->
  <line x1="480" y1="200" x2="540" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="700" y1="205" x2="760" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="400" y1="250" x2="400" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="430" y="270" font-size="10" font-style="italic" fill="#991b1b">si KO</text>
  <line x1="860" y1="280" x2="700" y2="380" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="220" y1="540" x2="320" y2="585" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="220" y="560" font-size="10" font-style="italic" fill="#155e75">deploy</text>
  <line x1="480" y1="585" x2="760" y2="220" stroke="#0891b2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Zone 3 : CONSUMPTION -->
  <rect x="1030" y="100" width="340" height="640" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1200" y="125" font-size="13" font-weight="700" text-anchor="middle" fill="#166534" letter-spacing="0.5">③ CONSUMPTION</text>

  <!-- Storage -->
  <g filter="url(#shadow)">
    <rect x="1050" y="160" width="300" height="100" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1200" y="184" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">consumer_storage.py</text>
    <text x="1200" y="205" font-size="11" text-anchor="middle" fill="#64748b">PostgreSQL · table payments_gold</text>
    <text x="1200" y="222" font-size="11" text-anchor="middle" fill="#64748b">UPSERT idempotent (trans_num)</text>
    <text x="1200" y="244" font-size="10" font-weight="600" text-anchor="middle" fill="#166534">durabilité &amp; rejouabilité</text>
  </g>

  <!-- Alerter -->
  <g filter="url(#shadow)">
    <rect x="1050" y="290" width="300" height="100" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1200" y="314" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">consumer_alerter.py</text>
    <text x="1200" y="335" font-size="11" text-anchor="middle" fill="#64748b">filter is_fraud == 1</text>
    <text x="1200" y="352" font-size="11" text-anchor="middle" fill="#64748b">Webhook Discord / SMTP</text>
    <text x="1200" y="374" font-size="10" font-weight="600" text-anchor="middle" fill="#991b1b">rate-limit 10 alertes/min</text>
  </g>

  <!-- Dashboard -->
  <g filter="url(#shadow)">
    <rect x="1050" y="420" width="300" height="120" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="1200" y="444" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">dashboard.py · Streamlit</text>
    <text x="1200" y="466" font-size="11" text-anchor="middle" fill="#64748b">5 KPIs temps réel</text>
    <text x="1200" y="481" font-size="11" text-anchor="middle" fill="#64748b">live feed + agrégations</text>
    <text x="1200" y="498" font-size="11" text-anchor="middle" fill="#64748b">filtres par catégorie / heure</text>
    <text x="1200" y="520" font-size="10" font-weight="600" text-anchor="middle" fill="#166534">localhost:8501</text>
  </g>

  <!-- Daily report -->
  <g filter="url(#shadow)">
    <rect x="1050" y="570" width="300" height="80" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1200" y="592" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">daily_report.py</text>
    <text x="1200" y="611" font-size="11" text-anchor="middle" fill="#64748b">cron 6h matin · SQL aggregation</text>
    <text x="1200" y="627" font-size="11" text-anchor="middle" fill="#64748b">JSON + email équipe</text>
  </g>

  <!-- Arrows from predictions to consumers -->
  <line x1="700" y1="430" x2="1050" y2="210" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="700" y1="430" x2="1050" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1200" y1="260" x2="1200" y2="420" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="1200" y1="540" x2="1200" y2="570" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Footer : 5 compétences -->
  <rect x="30" y="755" width="1340" height="35" rx="8" fill="#1e293b"/>
  <text x="60" y="778" font-size="12" font-weight="600" fill="#fff">5 compétences Bloc 3 :</text>
  <text x="220" y="778" font-size="12" fill="#fff">• <tspan font-weight="600" fill="#fb923c">Temps réel</tspan> Kafka</text>
  <text x="380" y="778" font-size="12" fill="#fff">• <tspan font-weight="600" fill="#60a5fa">ETL</tspan> Producer→Consumer→DB</text>
  <text x="650" y="778" font-size="12" fill="#fff">• <tspan font-weight="600" fill="#a3e635">Automatisation</tspan> Docker Compose</text>
  <text x="930" y="778" font-size="12" fill="#fff">• <tspan font-weight="600" fill="#34d399">Monitoring</tspan> Dashboard + Kafka UI</text>
  <text x="1180" y="778" font-size="12" fill="#fff">• <tspan font-weight="600" fill="#f87171">Qualité</tspan> Pydantic + DLQ</text>
</svg>
