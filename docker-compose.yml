# ----------------------------------------------------------------------
# Stack complete pour le pipeline de detection de fraude
#
# Usage :
#   docker compose up -d
#   docker compose logs -f producer consumer-predictor
#   docker compose down
# ----------------------------------------------------------------------

services:

  # =====================================================================
  # INFRASTRUCTURE
  # =====================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: miniominio
    command: >
      bash -c "pip install psycopg2-binary boto3 &&
               mlflow server
                 --backend-store-uri postgresql+psycopg2://fraud:fraud@postgres:5432/fraud
                 --default-artifact-root s3://mlflow/
                 --host 0.0.0.0
                 --port 5000"

  # =====================================================================
  # APPLICATION
  # =====================================================================

  fake-api:
    build: .
    command: python fake_api.py
    ports:
      - "8002:8000"        # 8002 cote hote (peu utilise), 8000 cote conteneur
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./:/app

  producer:
    build: .
    command: python producer.py
    depends_on:
      kafka:
        condition: service_healthy
      fake-api:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      API_URL: http://fake-api:8000/current-transactions
      # Mode demo : 30 messages toutes les 6s + 10% de fraudes oversamplees
      # => ~3 fraudes detectables par minute pour la demo
      # Pour revenir au mode normal : POLL_INTERVAL=12 BATCH_SIZE=5 FRAUD_RATE=0
      POLL_INTERVAL: 6
      BATCH_SIZE: 30
      FRAUD_RATE: 0.1
    volumes:
      - ./:/app
    restart: unless-stopped

  consumer-predictor:
    build: .
    command: python consumer_predictor.py
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MODEL_PATH: /app/model.pkl
    volumes:
      - ./:/app
    restart: unless-stopped

  consumer-storage:
    build: .
    command: python consumer_storage.py
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql+psycopg2://fraud:fraud@postgres:5432/fraud
    volumes:
      - ./:/app
    restart: unless-stopped

  consumer-alerter:
    build: .
    command: python consumer_alerter.py
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ALERT_BACKEND: webhook              # ou smtp si tu configures les SMTP_*
      WEBHOOK_URL: ${WEBHOOK_URL:-}        # vide par defaut, set via .env
    volumes:
      - ./:/app
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg2://fraud:fraud@postgres:5432/fraud
    volumes:
      - ./:/app

volumes:
  pg-data:
  minio-data:
